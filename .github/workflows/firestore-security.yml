name: Firestore security emulator
on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - 'security/firestore/**'
      - '.github/workflows/firestore-security.yml'
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: security/firestore/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: security/firestore
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: services/economy
      - name: Test Rules and transactions (surface failure diagnostics)
        working-directory: security/firestore
        shell: bash
        run: |
          set +e
          npm test > security-test.log 2>&1
          result=$?
          cat security-test.log
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYDIAG'
          from pathlib import Path
          text=Path('security-test.log').read_text(errors='replace')
          # Logs downloads may be unavailable; expose failure context via Checks API.
          import re
          failures=[text[max(0,m.start()-150):m.start()+2400] for m in re.finditer(r'not ok',text)]
          for chunk in failures or [text[-3000:]]:
              escaped=chunk.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error::Security test failed: '+escaped)
          PYDIAG
          fi
          exit "$result"
      - name: Upload security test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-failure-log
          path: security/firestore/security-test.log
          if-no-files-found: ignore
          retention-days: 14
