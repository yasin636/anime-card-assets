name: Firestore security emulator
on:
  workflow_dispatch:
  push:
    paths:
      - 'security/firestore/**'
      - '.github/workflows/firestore-security.yml'
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: security/firestore/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: security/firestore
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: services/economy
      - run: npm test
        working-directory: security/firestore
