name: Watch public media diagnostics
on:
  workflow_dispatch:
  push:
    branches: [arena/cd835a4c-anime-card-assets]
    paths: [.github/workflows/watch-source-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify public BYOS fixture and HLS test media
        run: python3 tools/check-watch-lab-media.py
      - name: Check public open-film media bytes and codecs (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          URL='https://archive.org/download/BigBuckBunny_328/BigBuckBunny_512kb.mp4'
          curl --fail --location --retry 1 --max-time 60 --max-filesize 1048576 --range 0-4095 -D "$RUNNER_TEMP/media-headers.txt" "$URL" -o "$RUNNER_TEMP/media-head.bin"
          cat "$RUNNER_TEMP/media-headers.txt"
          python3 - "$RUNNER_TEMP/media-head.bin" <<'PY'
          import sys
          data=open(sys.argv[1],'rb').read()
          assert 16 <= len(data) <= 1048576, 'Unexpected range response size'
          assert data[4:8] == b'ftyp', 'Not an MP4 ftyp header'
          print('PASS public MP4 byte probe:', len(data), 'bytes, brand', repr(data[8:12]))
          PY
          echo '::notice title=MP4 byte check::PASS public Range response has MP4 ftyp header.'
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          timeout 90 ffprobe -v error -show_entries format=duration:stream=codec_name,codec_type,width,height -of json "$URL" > "$RUNNER_TEMP/probe.json"
          python3 - "$RUNNER_TEMP/probe.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]));duration=float(d['format']['duration']);streams=d['streams']
          assert duration>500, 'Not the full short film'
          assert any(s.get('codec_name')=='h264' for s in streams), 'Expected H264 video'
          print('::notice title=Media codec check::PASS '+json.dumps(d,separators=(',',':')))
          PY
