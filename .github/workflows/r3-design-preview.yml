name: R3 downloadable design preview
on:
  workflow_dispatch:
  push:
    branches: [arena/cd835a4c-anime-card-assets]
    paths: [.github/workflows/r3-design-preview.yml, design/r3/**]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --prefix design/r1 --no-audit --no-fund
      - run: node --test design/r3/preview.test.cjs
      - run: node design/r3/bundle.cjs /tmp/r3-preview/AnimeMetaHub-R3-Edition01.html
      - name: Add phone instructions and checksum
        run: |
          printf '%s\n' 'R3 Chat / Sensei / Arena / Adventure — interactive design preview only.' 'Sample data: no real purchases, account access, server calls or persistence. Reload resets the demo.' 'Extract this ZIP, then open AnimeMetaHub-R3-Edition01.html in Chrome or an HTML viewer. All artwork/scripts are offline.' 'Bottom navigation: Chat, Sensei, Arena, Adventure. Chat tabs: Inbox / Global lounge.' 'Try: DM, Global mission panel, Sensei Copy/Retry/Stop and Arena/Adventure presentation.' 'Sensei settings offers a sample connection-error preview.' 'Native implementation begins after visual approval. No APK or Render deploy needed for this preview.' > /tmp/r3-preview/READ-ME.txt
          cd /tmp/r3-preview && sha256sum AnimeMetaHub-R3-Edition01.html > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeMetaHub-R3-Edition01-Preview
          path: /tmp/r3-preview/
          retention-days: 14
          if-no-files-found: error
