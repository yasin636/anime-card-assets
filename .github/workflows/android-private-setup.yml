name: Private Android Firebase setup check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-private-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate secrets without printing them
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          python3 tools/check-private-android-setup.py --output "$RUNNER_TEMP/anime-private-setup"
      - name: Public result summary
        run: |
          {
            echo '## Private Android setup validated'
            echo 'Private keystore opens with the supplied password and matches the pinned certificate.'
            echo 'Firebase project/package, Android OAuth certificate and web OAuth client are present.'
            echo 'This is a configuration check only, not a login test or an APK build.'
            cat docs/react-native-blueprint/android-test-certificate.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary private material
        if: always()
        run: rm -rf "$RUNNER_TEMP/anime-private-setup"
