name: Private Android Firebase setup check

on:
  push:
    branches: [arena/cd835a4c-anime-card-assets]
    paths:
      - .github/workflows/android-private-setup.yml
      - tools/check-private-android-setup.py
  workflow_dispatch:
    inputs:
      signing_only:
        description: Check only the two signing secrets (no Firebase secret needed yet)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify-private-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate secrets without printing them
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
          SIGNING_ONLY: ${{ github.event_name == 'push' || inputs.signing_only }}
        run: |
          args=(--output "$RUNNER_TEMP/anime-private-setup")
          if [ "$SIGNING_ONLY" = 'true' ]; then args+=(--signing-only); fi
          python3 tools/check-private-android-setup.py "${args[@]}"
      - name: Public result summary
        env:
          SIGNING_ONLY: ${{ github.event_name == 'push' || inputs.signing_only }}
        run: |
          {
            echo '## Private Android setup validated'
            echo 'Private keystore opens with the supplied password and matches the pinned certificate.'
            if [ "$SIGNING_ONLY" = 'true' ]; then
              echo 'Signing-only mode: Firebase config was NOT checked.'
            else
              echo 'Firebase project/package, Android OAuth certificate and web OAuth client are present.'
            fi
            echo 'This is a configuration check only, not a login test or an APK build.'
            cat docs/react-native-blueprint/android-test-certificate.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary private material
        if: always()
        run: rm -rf "$RUNNER_TEMP/anime-private-setup"
