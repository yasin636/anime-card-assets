name: Android test APK

on:
  workflow_dispatch:
  push:
    branches: [arena/cd835a4c-anime-card-assets]
    paths:
      - apps/mobile/**
      - .github/workflows/android-apk.yml

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: ./.github/workflows/firestore-security.yml
  build:
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_ECONOMY_API_URL: ${{ vars.ECONOMY_SECURITY_REVIEWED == 'true' && vars.ECONOMY_API_URL || '' }}
      # Owner-test endpoint is NOT an attestation of global economy approval.
      # Server verified-UID allowlist and read-only probe gate every mutation.
      EXPO_PUBLIC_ECONOMY_OWNER_TEST_URL: https://anime-meta-hub-economy.onrender.com
      NODE_ENV: production
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Validate and restore private signing and Firebase config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          python3 ../../tools/check-private-android-setup.py --output "$RUNNER_TEMP/anime-private-setup"
          cp "$RUNNER_TEMP/anime-private-setup/google-services.json" google-services.json
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/anime-private-setup/test-signing.p12" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Generate client-only Firebase configuration
        run: npm run prepare:firebase
      - name: TypeScript validation
        run: npm run typecheck
      - name: Validate navigation, profile rules and Android autolinking
        run: |
          node ../../tools/validate-mobile-foundation.cjs
          node ../../tools/test-mobile-profile.cjs
          node --test ../../tools/test-gemini.cjs ../../tools/test-economy-autoconnect.cjs ../../tools/test-arena-presentation.cjs
          NODE_ENV=test node --test ../../tools/test-economy-provider.cjs ../../tools/test-arena-visuals.cjs ../../tools/test-ai-quiz-broker.cjs ../../tools/test-story-mobile.cjs
          node --test ../../services/economy/*.test.cjs
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Configure verified private test signing (no public-key fallback)
        run: node scripts/configure-private-signing.cjs
      - name: Allow slow first-time Gradle downloads
        run: |
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' android/gradle/wrapper/gradle-wrapper.properties
          # Avoid the services.gradle.org -> GitHub release redirect (504 on first run).
          sed -i 's/services.gradle.org/downloads.gradle.org/' android/gradle/wrapper/gradle-wrapper.properties
      - name: Compile standalone release-mode test APK
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" 2>&1 | tee ../gradle-build.log
      - name: Report compilation failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('gradle-build.log')
          if p.exists():
              text = p.read_text(errors='replace')
              lines = text.splitlines()
              selected = [x for x in lines if any(k in x for k in ['What went wrong', 'Exception', 'Caused by:', 'Could not', 'error:', 'FAILURE:', 'Execution failed'])]
              message = '\n'.join(selected[-30:] or lines[-40:])[:8000]
              print('::error title=Gradle compilation details::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - name: Verify APK signature, metadata, and embedded JavaScript
        run: |
          set -euo pipefail
          trap 'echo "::error::APK verification failed at shell line $LINENO: $BASH_COMMAND"' ERR
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          TOOLS="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          if ! "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > apk-signature.txt 2>&1; then
            cat apk-signature.txt
            echo "::error::apksigner rejected the built APK: $(tail -c 2000 apk-signature.txt | tr '\n' ' ')"
            exit 1
          fi
          cat apk-signature.txt
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          expected=json.loads(Path('../../docs/react-native-blueprint/android-test-certificate.json').read_text())['sha256'].replace(':','').lower()
          output=Path('apk-signature.txt').read_text()
          # Build Tools 36+ may label signers by SDK range instead of "#1".
          digests=re.findall(r'certificate SHA-256 digest:\s*([a-fA-F0-9:]+)',output,re.IGNORECASE)
          actual={value.replace(':','').lower() for value in digests}
          if not actual:
              safe=output[:2500].replace('\n',' ')
              print(f'::error::No APK certificate SHA256 in apksigner output: {safe}')
              raise SystemExit(1)
          if actual != {expected}:
              print(f'::error::APK certificate mismatch: got {sorted(actual)}, expected {expected}')
              raise SystemExit(1)
          print('APK private certificate matches pinned manifest.')
          PY
          "$TOOLS/aapt" dump badging "$APK" > apk-metadata.txt
          sed -n '1,40p' apk-metadata.txt
          unzip -l "$APK" | grep 'assets/index.android.bundle'
          mkdir -p apk-output
          cp "$APK" apk-output/AnimeMetaHub-v0.7.1-narrative-part2-test.apk
          cd apk-output
          sha256sum *.apk > SHA256SUMS.txt
          cp NARRATIVE-PART2-TEST.md README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeMetaHub-v0.7.1-narrative-part2-test
          path: apps/mobile/apk-output/
          retention-days: 14
          if-no-files-found: error
      - name: Build summary
        run: |
          {
            echo '## Step05 Story test APK v0.7.1'
            echo 'Standalone Android APK, ARM64 + ARMv7. Android 7.0+ (API 24+) expected; see APK metadata for the actual minimum.'
            echo 'Auth/profile/owned inventory are live. Collection/Shop commands require configured trusted backend; absent URL disables actions. Gemini BYOK in Settings/AI Provider; Sensei in Chat, key stored in device SecureStore; Quiz uses authorized transient HTTPS headers to trusted backend. Gallery deferred. Not a completed production economy deployment.'
            echo 'Signed with the verified PRIVATE internal-test certificate. Private v0.2.0 can update in place. Uninstall public-key sample v0.1.0 only.'
            echo 'Download the artifact ZIP and extract the APK to install on Android.'
            cat apk-output/SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean temporary signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/anime-private-setup"
          rm -f google-services.json
