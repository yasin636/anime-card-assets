name: R1 downloadable design preview
on:
  workflow_dispatch:
  push:
    branches: [arena/cd835a4c-anime-card-assets]
    paths: [.github/workflows/r1-design-preview.yml, design/r1/**]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --prefix design/r1 --no-audit --no-fund
      - run: npm --prefix design/r1 test
      - run: node design/r1/bundle.cjs /tmp/r1-preview/AnimeMetaHub-R1-Preview.html
      - name: Add phone instructions
        run: |
          printf '%s\n' 'R1 design preview only. Sample data, no real account actions.' 'Extract this ZIP, then open AnimeMetaHub-R1-Preview.html in Chrome or an HTML viewer.' 'No server or internet needed after download. Profile/Feed tabs are at the bottom.' > /tmp/r1-preview/READ-ME.txt
          cd /tmp/r1-preview && sha256sum AnimeMetaHub-R1-Preview.html > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeMetaHub-R1-Design-Preview
          path: /tmp/r1-preview/
          retention-days: 14
          if-no-files-found: error
